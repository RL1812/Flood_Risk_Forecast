<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Singapore Flood Risk & Forecasting Explorer{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  {% block head %}{% endblock %}
</head>

<body class="bg-light">
  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
        <span class="fs-4 me-2">🌊</span>
        <span>Singapore Flood Intel</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
        aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-pills align-items-lg-center">
          <li class="nav-item me-lg-2">
            <a class="nav-link active px-3 py-2 fw-semibold" id="navVulnerability" href="#vulnerability" role="button">
              <i class="bi bi-map-fill me-1"></i> Flood vulnerability map in Singapore
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-3 py-2 fw-semibold" id="navForecast" href="#forecast" role="button">
              <i class="bi bi-clock-history me-1"></i> Flood risk forecast in 15 mins
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-lg-4 py-3">
    {% block main%}{% endblock %}
  </main>

  <!-- Bootstrap 5 JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  {% block scripts %}{% endblock %}
</body>

</html>
